plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'cc.star0.stylusorientationfixer'
    compileSdk {
        version = release(35)
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "cc.star0.stylusorientationfixer"
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly libs.xposed.api
}